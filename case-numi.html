<title id="pageTitle">Numi — Coming Soon | Aranza Isea</title>
<meta id="pageDesc" name="description" content="Numi: an AI-powered meal-planning app, designed and shipped independently by Aranza Isea, Product Designer. Coming soon.">

<style>

  :root{
    --bg: #f7f7f6;
    --bg-alt: #ffffff;
    --ink: #14141a;
    --ink-soft: #55555f;
    --ink-faint: #8a8a92;
    --line: #e4e4e0;
    --c1: #2b2fd9;
    --c2: #d9268f;
    --c3: #f0932b;
    --v-primary: #5B6EF5;
    --v-agent: #14C9B0;
    --radius: 14px;
    --maxw: 1080px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    min-height:100vh;
    display:flex; flex-direction:column;
  }
  img{ max-width:100%; display:block; }
  a{ color:inherit; text-decoration:none; }

  /* ---------- NAV (shared pattern) ---------- */
  .case-nav{ position:sticky; top:0; z-index:50; background: rgba(247,247,246,0.9); backdrop-filter: blur(10px); border-bottom:1px solid var(--line); }
  .case-nav-inner{ max-width: var(--maxw); margin:0 auto; padding:16px 32px; display:flex; align-items:center; justify-content:space-between; gap:18px; }
  .case-nav-left{ display:flex; align-items:center; gap:22px; }
  .nav-logo{ font-family:'Inter',sans-serif; font-weight:400; font-size:13.5px; letter-spacing:0.26em; text-transform:uppercase; color:var(--ink); white-space:nowrap; display:flex; align-items:center; }
  .back-link{ display:inline-flex; align-items:center; gap:7px; font-size:13.5px; font-weight:700; color: var(--ink-soft); white-space:nowrap; }
  .back-link:hover{ color: var(--ink); }
  .nav-right{ display:flex; align-items:center; gap:14px; }
  .nav-cta{
    font-size:13px; font-weight:700; padding:9px 18px; border-radius: 999px;
    border: 1.5px solid var(--ink); white-space:nowrap;
  }
  .lang-switch{
    display:flex; border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; background: var(--bg-alt);
  }
  .lang-btn{
    padding:5px 11px; font-size:12px; font-weight:800; border-radius:999px; cursor:pointer;
    border:none; background:transparent; color: var(--ink-faint); font-family:inherit; letter-spacing:0.3px;
    transition: all .15s ease;
  }
  .lang-btn.active{ background: var(--ink); color:#fff; }

  /* ---------- SOON SCREEN ---------- */
  .soon-wrap{
    flex:1; display:flex; align-items:center; justify-content:center;
    padding: 60px 32px;
  }
  .soon-card{
    text-align:center; max-width: 460px;
  }
  .soon-icon{
    width:104px; height:104px; margin:0 auto 24px;
    display:flex; align-items:center; justify-content:center;
    filter: drop-shadow(0 14px 22px rgba(20,20,26,0.16));
  }
  .soon-icon img{ width:100%; height:100%; object-fit:contain; display:block; }
  .soon-card p.eyebrow{
    font-size: 12.5px; font-weight:700; letter-spacing: 2px; text-transform: uppercase;
    color: var(--ink-faint); margin: 0 0 14px 0;
  }
  .soon-card h1{
    font-size: clamp(26px, 4vw, 34px); font-weight:800; letter-spacing:-0.6px;
    margin: 0 0 14px 0; line-height:1.15;
  }
  .soon-card p.desc{
    font-size: 15.5px; line-height:1.7; color: var(--ink-soft); margin: 0 0 36px 0;
  }
  .btn{
    display:inline-flex; align-items:center; gap:8px;
    font-size: 14.5px; font-weight:700; padding: 13px 26px; border-radius: 999px;
    border: 1.5px solid var(--ink); transition: all .18s ease;
  }
  .btn-solid{ background: var(--ink); color:#fff; }
  .btn-solid:hover{ background:#000; transform: translateY(-1px); }
  .btn-solid svg{ width:16px; height:16px; }

  footer{ padding: 34px 32px; text-align:center; font-size:13px; color: var(--ink-faint); }

  @media (max-width: 640px){
    .case-nav-inner{ padding:14px 20px; }
    .nav-cta, .lang-switch{ display:none; }
  }

</style>
</head>
